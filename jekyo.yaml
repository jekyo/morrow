app: morrow
description: Persistent browser infrastructure — browsers that remember.

services:
  morrow:
    image: ghcr.io/jekyo/morrow:0.5.0   # bump tag per release
    port: 3000
    http:
      domain: morrow.example.com        # replace with your domain
    env:
      MORROW_API_KEY: ${MORROW_API_KEY}
    health:
      path: /api/v1/health
    resources:
      cpu: 500m
      memory: 1Gi
      memory-max: 4Gi
    volumes:
      data: /data

volumes:
  data:
    size: 10Gi
