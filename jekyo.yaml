app: morrow
description: Persistent browser infrastructure — browsers that remember.

services:
  # Named "web", not "morrow": Kubernetes injects <SERVICE>_PORT service-
  # discovery env vars, so a service named "morrow" would set MORROW_PORT to a
  # tcp:// URL and collide with Morrow's own MORROW_PORT config. "web" avoids the
  # MORROW_ prefix entirely.
  web:
    image: ghcr.io/jekyo/morrow:1.1.0   # bump tag per release
    port: 3000
    http:
      domain: morrow.jekyo.app
    env:
      MORROW_API_KEY: ${MORROW_API_KEY}
    health:
      path: /api/v1/health
    resources:
      cpu: 500m
      memory: 1Gi
      memory-max: 4Gi
    volumes:
      data: /data

volumes:
  data:
    size: 10Gi
